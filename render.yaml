# Render Blueprint: one web service (Django API + the frontend) and one Postgres database.
# Deploy: push this folder to GitHub -> Render dashboard -> New -> Blueprint -> select the repo.
databases:
  - name: jobcare-db
    databaseName: jobcare
    user: jobcare
    plan: free

services:
  - type: web
    name: jobcare
    runtime: python
    plan: free
    buildCommand: cd backend && bash build.sh
    startCommand: cd backend && gunicorn jobcare_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --log-file -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobcare-db
          property: connectionString
      - key: DEMO_PAYMENTS
        value: "False"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Set these two in the Render dashboard (not stored in git) to get an admin login at /admin/
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
